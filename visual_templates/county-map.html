<div id="epidemic-county-map">
  <h3>County spread and behavioral-information effects</h3>
  <div class="viz-controls">
    <label class="form-label">View
      <select class="form-select" data-view>
        <option value="difference">Epidemic-only minus behavior-aware: weekly cases per 100,000</option>
        <option value="oracle">Behavior-aware: weekly cases per 100,000</option>
        <option value="epidemic">Epidemic-only: weekly cases per 100,000</option>
        <option value="none">No intervention: weekly cases per 100,000</option>
      </select>
    </label>
  </div>
  <div class="viz-row"><label class="form-label">Week <span data-week>1</span> · ending <span data-date></span></label></div>
  <div class="viz-row"><button class="btn" type="button" data-play>Play</button><input class="form-range" data-time type="range" min="0" max="11" step="1" value="0" aria-label="Simulation week"></div>
  <svg data-map role="img" aria-label="US counties colored by simulated weekly infection rate or policy difference"></svg>
  <div class="viz-row text-small" data-legend></div>
  <div class="text-small tabular-nums" aria-live="polite" data-selection>Choose a county to inspect its values.</div>
  <div class="text-small text-muted">Simulated counterfactual · 1% population-equivalent weekly budget · fixed July mobility · gray: excluded or unavailable · Census 2020 geometry</div>
</div>
<style>
#epidemic-county-map{position:relative;color:var(--foreground)}
#epidemic-county-map [data-map]{display:block;width:100%;height:auto;margin:8px 0}
#epidemic-county-map .county{stroke:var(--border);stroke-width:.35}
#epidemic-county-map .county.selected{stroke:var(--foreground);stroke-width:1.5}
#epidemic-county-map .legend-swatch{display:inline-block;width:22px;height:12px;vertical-align:middle;margin-right:4px}
</style>
<script src="https://cdn.jsdelivr.net/npm/d3@7.9.0/dist/d3.min.js"></script>
<script>
(async()=>{
 const root=document.getElementById('epidemic-county-map');
 const packed='__MAP_PAYLOAD__';
 const bytes=Uint8Array.from(atob(packed),x=>x.charCodeAt(0));
 const stream=new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'));
 const data=JSON.parse(await new Response(stream).text());
 // d3-geo uses clockwise exterior rings for small spherical polygons.
 for(const feature of data.features){
   const polygons=feature.geometry.type==='Polygon'?[feature.geometry.coordinates]:feature.geometry.coordinates;
   for(const polygon of polygons){
     if(d3.geoArea({type:'Polygon',coordinates:polygon})>2*Math.PI){
       for(const ring of polygon)ring.reverse();
     }
   }
 }
 const index=new Map(data.county_order.map((f,i)=>[f,i]));
 const svg=d3.select(root.querySelector('[data-map]'));
 const slider=root.querySelector('[data-time]');
 const select=root.querySelector('[data-view]');
 const play=root.querySelector('[data-play]');
 let selected=null,timer=null;
 const saved=window.openai?.widgetState;
 if(saved?.privateContent?.week!==undefined)slider.value=Math.max(0,Math.min(11,saved.privateContent.week));
 if(['difference','oracle','epidemic','none'].includes(saved?.privateContent?.view))select.value=saved.privateContent.view;
 function persist(){window.openai?.setWidgetState?.({modelContent:{week:+slider.value+1,view:select.value,county:selected},privateContent:{week:+slider.value,view:select.value}}).catch(()=>{});}
 const allRates=['none','epidemic','oracle'].flatMap(p=>data.series[p].weekly_rate.flat()).sort(d3.ascending);
 const allDiff=data.series.epidemic.weekly_rate.flatMap((row,t)=>row.map((v,i)=>Math.abs(v-data.series.oracle.weekly_rate[t][i]))).sort(d3.ascending);
 const rateCap=d3.quantile(allRates,.97)||1, diffCap=d3.quantile(allDiff,.97)||1;
 const fmt=d3.format(',.2f');
 function themeColor(token){const probe=document.createElement('span');probe.style.color=`var(${token})`;probe.style.display='none';root.append(probe);const color=getComputedStyle(probe).color;probe.remove();const canvas=document.createElement('canvas');canvas.width=canvas.height=1;const ctx=canvas.getContext('2d');ctx.fillStyle=color;ctx.fillRect(0,0,1,1);const [r,g,b,a]=ctx.getImageData(0,0,1,1).data;return `rgba(${r},${g},${b},${a/255})`;}
 function values(t,i){return Object.fromEntries(['none','epidemic','oracle'].map(p=>[p,data.series[p].weekly_rate[t][i]]));}
 function detail(){
   const element=root.querySelector('[data-selection]');
   if(!selected){element.textContent='Choose a county to inspect its values.';return;}
   const feature=data.features.find(f=>f.id===selected),i=index.get(selected);
   if(i===undefined){element.textContent=`${feature.properties.name} (${selected}) · excluded from this simulation`;return;}
   const v=values(+slider.value,i);
   element.textContent=`${feature.properties.name} (${selected}) · no intervention ${fmt(v.none)} · epidemic-only ${fmt(v.epidemic)} · behavior-aware ${fmt(v.oracle)} · difference ${fmt(v.epidemic-v.oracle)} cases per 100,000 this week`;
 }
 function draw(){
   const width=Math.max(320,root.clientWidth),height=width*.62,t=+slider.value,mode=select.value;
   const color1=themeColor('--viz-series-1'),color2=themeColor('--viz-series-2');
   const neutral=themeColor('--muted'),missing=themeColor('--muted-foreground');
   const projection=d3.geoAlbersUsa().fitExtent([[8,8],[width-8,height-8]],{type:'FeatureCollection',features:data.features});
   const path=d3.geoPath(projection);
   svg.attr('viewBox',`0 0 ${width} ${height}`);
   const scale=mode==='difference'?d3.scaleLinear().domain([-diffCap,0,diffCap]).range([color2,neutral,color1]).clamp(true):d3.scaleLinear().domain([0,rateCap]).range([neutral,color1]).clamp(true);
   svg.selectAll('path').data(data.features,f=>f.id).join('path').attr('class',f=>'county cursor-interaction'+(f.id===selected?' selected':''))
     .attr('d',path).attr('fill',f=>{const i=index.get(f.id);if(i===undefined)return missing;const v=values(t,i);return scale(mode==='difference'?v.epidemic-v.oracle:v[mode]);})
     .attr('data-tooltip',f=>{const i=index.get(f.id);if(i===undefined)return `${f.properties.name} (${f.id}): excluded`;const v=values(t,i);return `${f.properties.name} (${f.id}): ${fmt(mode==='difference'?v.epidemic-v.oracle:v[mode])} cases per 100,000`;})
     .on('click',(event,f)=>{selected=f.id;detail();persist();draw();});
   root.querySelector('[data-week]').textContent=t+1;
   const date=new Date(Date.UTC(2020,7,31+7*(t+1)-1));root.querySelector('[data-date]').textContent=date.toISOString().slice(0,10);
   const legend=root.querySelector('[data-legend]');legend.replaceChildren();
   const items=mode==='difference'?[[color2,'More cases under behavior-aware'],[neutral,'No difference'],[color1,'Fewer cases under behavior-aware']]:[[neutral,'Lower infection rate'],[color1,'Higher infection rate']];
   for(const [color,label] of items){const span=document.createElement('span'),swatch=document.createElement('span');swatch.className='legend-swatch';swatch.style.backgroundColor=color;span.append(swatch,document.createTextNode(label));legend.append(span);}
   const cap=document.createElement('span');cap.textContent=`Color scale capped at ${fmt(mode==='difference'?diffCap:rateCap)} (97th percentile across weeks)`;legend.append(cap);detail();
 }
 slider.addEventListener('input',()=>{draw();persist();});select.addEventListener('change',()=>{draw();persist();});
 play.addEventListener('click',()=>{if(timer){clearInterval(timer);timer=null;play.textContent='Play';return;}play.textContent='Pause';timer=setInterval(()=>{if(+slider.value>=11){clearInterval(timer);timer=null;play.textContent='Play';return;}slider.value=+slider.value+1;draw();},1000);});
 window.addEventListener('openai:set_globals',event=>{const s=event.detail?.globals?.widgetState?.privateContent;if(s){slider.value=s.week??0;select.value=s.view??'difference';draw();}});
 new ResizeObserver(draw).observe(root);draw();
})().catch(error=>{const root=document.getElementById('epidemic-county-map');const alert=document.createElement('div');alert.setAttribute('role','alert');alert.textContent='Map could not load: '+error.message;root.append(alert);});
</script>
