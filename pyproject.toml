[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "epidemic-responsiveness"
version = "0.1.0"
description = "Case-calibrated U.S. county study of behavioral information in epidemic resource allocation"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26,<3",
    "scipy>=1.11,<2",
    "pandas>=2.0,<4",
    "scikit-learn>=1.4,<2",
]

[project.optional-dependencies]
dev = ["autopep8>=2.3,<3"]

[tool.setuptools.packages.find]
include = ["epidemic*"]
exclude = ["tests*", "data*", "outputs*", "results*"]

[tool.autopep8]
max_line_length = 100
ignore = ["E402", "E711", "E712"]
